<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient: Deep Apple Royal Blue to Electric Indigo -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0071e3" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <!-- Golden Sparkle & Soundwave Gradient -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Shadow for depth -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Modern Squircle Base -->
  <rect width="64" height="64" rx="16" fill="url(#bgGradient)" />

  <!-- Inner Soft Bevel Border -->
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="rgba(255,255,255,0.22)" stroke-width="1.5" fill="none" />

  <!-- English Learning Elements: Stylized Open Knowledge Book & Fluent Sound Waves -->
  <g filter="url(#glow)">
    <!-- Open Book Pages (Left & Right Wings) -->
    <path d="M14 43.5C20.5 40.5 27 41.5 32 44.5C37 41.5 43.5 40.5 50 43.5V23C43.5 20 37 21 32 24C27 21 20.5 20 14 23V43.5Z" 
          fill="rgba(255,255,255,0.15)" 
          stroke="rgba(255,255,255,0.5)" 
          stroke-width="1.5" 
          stroke-linejoin="round" />

    <!-- Center Spine Line -->
    <path d="M32 24V44.5" stroke="rgba(255,255,255,0.6)" stroke-width="1.5" stroke-linecap="round" />

    <!-- Bold Vibrant "V" Crest (VBace / Victory in English Fluency) -->
    <path d="M21 20L32 38L43 20" 
          stroke="url(#accentGradient)" 
          stroke-width="4.5" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Speech / Audio Wave Arc (Speaking & Listening Reflex) -->
    <path d="M47 16C50 19 51.5 23 51.5 27.5C51.5 32 50 36 47 39" 
          stroke="#38bdf8" 
          stroke-width="2.2" 
          stroke-linecap="round" 
          opacity="0.9" />

    <path d="M52 12C56 16.5 58 22 58 27.5C58 33 56 38.5 52 43" 
          stroke="#7dd3fc" 
          stroke-width="2" 
          stroke-linecap="round" 
          opacity="0.65" />

    <!-- AI / Excellence Sparkle Star (Top Left) -->
    <path d="M18 11L19.2 14.8L23 16L19.2 17.2L18 21L16.8 17.2L13 16L16.8 14.8L18 11Z" 
          fill="#fef08a" />
  </g>
</svg>